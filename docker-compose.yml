version: '3.8'

services:
  # SubLedger API Service
  api:
    build: .
    container_name: subledger-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://subledger:subledger@db:5432/subledger
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - subledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: subledger-db
    environment:
      - POSTGRES_USER=subledger
      - POSTGRES_PASSWORD=subledger
      - POSTGRES_DB=subledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subledger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: subledger-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - subledger-network

volumes:
  postgres_data:
    driver: local

networks:
  subledger-network:
    driver: bridge
